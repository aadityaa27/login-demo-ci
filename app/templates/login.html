<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex;
           justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
           width: 300px; }
    h1 { font-size: 20px; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 10px; background: #2563eb; color: #fff;
             border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sign in</h1>
    <form method="POST" action="/login" id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />

      <button type="submit" id="login-btn">Login</button>

      {% if error %}
      <div class="error" id="error-message">{{ error }}</div>
      {% endif %}
    </form>
  </div>
</body>
</html>
