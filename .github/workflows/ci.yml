name: Login App CI (Selenium)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tests/requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start Flask app in background
        run: |
          cd app
          nohup python app.py &
          sleep 3

      - name: Run Selenium tests
        run: pytest tests/test_login_selenium.py -v